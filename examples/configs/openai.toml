# OpenAI.
#
#   export OPENAI_API_KEY=sk-...
#   synthlite examples/prompts.jsonl --config examples/configs/openai.toml --out out/openai
#
# The same run needs no file at all:
#   OPENAI_MODEL=gpt-4.1-mini synthlite examples/prompts.jsonl --out out/openai

[[key]]
provider = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"               # any chat model your key can use
api_key_env = "OPENAI_API_KEY"       # the variable NAME; the secret stays in the environment

# Defaults that suit a hosted API, shown for reference:
# max_concurrent = 16                # ceiling; a 429 halves it, clean answers grow it back
# timeout_seconds = 600              # idle: the longest gap between streamed chunks
# max_tokens_field = "max_completion_tokens"   # automatic for api.openai.com
